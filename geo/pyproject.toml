[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadai-geo"
version = "0.1.0"
description = "build123d geometry runner and HTTP service"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["cadai_geo*"]

# The runner points scripts at cadai_geo/fonts (CADAI_FONTS); a non-editable install needs them too.
[tool.setuptools.package-data]
cadai_geo = ["fonts/*"]
